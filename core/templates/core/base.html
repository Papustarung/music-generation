<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Music Generation{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f14;
      color: #e8e8f0;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      height: 56px;
      background: #1a1a26;
      border-bottom: 1px solid #2e2e45;
    }
    .nav-brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: #a78bfa;
      text-decoration: none;
      margin-right: 16px;
      letter-spacing: 0.02em;
    }
    .nav-links { display: flex; gap: 4px; flex: 1; }
    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      color: #b0b0c8;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s, color 0.15s;
    }
    .nav-link:hover, .nav-link:focus {
      background: #2e2e45;
      color: #e8e8f0;
      outline: 2px solid #a78bfa;
      outline-offset: 1px;
    }
    .nav-link.active { background: #2e2e45; color: #a78bfa; }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }
    .nav-username {
      font-size: 0.85rem;
      color: #8080a0;
    }
    .btn-nav-logout {
      padding: 6px 14px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid #4a4a68;
      color: #b0b0c8;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-nav-logout:hover, .btn-nav-logout:focus {
      border-color: #a78bfa;
      color: #a78bfa;
      outline: 2px solid #a78bfa;
      outline-offset: 1px;
    }
    .btn-nav-signin {
      padding: 6px 16px;
      border-radius: 6px;
      background: #a78bfa;
      border: none;
      color: #0f0f14;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-nav-signin:hover, .btn-nav-signin:focus {
      background: #c4b5fd;
      outline: 2px solid #fff;
      outline-offset: 1px;
    }

    /* ── Page wrapper ── */
    .page-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ── Messages ── */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .alert-error { background: #3b1212; border: 1px solid #7f1d1d; color: #fca5a5; }
    .alert-success { background: #0f2e1a; border: 1px solid #166534; color: #86efac; }

    /* ── Cards ── */
    .card {
      background: #1a1a26;
      border: 1px solid #2e2e45;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #c4b5fd;
      margin-bottom: 16px;
    }

    /* ── Forms ── */
    label {
      display: block;
      font-size: 0.85rem;
      color: #9090b0;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="email"], input[type="password"],
    select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #0f0f14;
      border: 1px solid #3a3a55;
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 0.95rem;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #a78bfa;
      box-shadow: 0 0 0 2px rgba(167,139,250,0.2);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      border: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:focus { outline: 2px solid #a78bfa; outline-offset: 2px; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #a78bfa; color: #0f0f14; }
    .btn-primary:hover { background: #c4b5fd; }
    .btn-secondary { background: #2e2e45; color: #e8e8f0; border: 1px solid #4a4a68; }
    .btn-secondary:hover { background: #3a3a55; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; }
    .btn-danger:hover { background: #991b1b; }
    .btn-google {
      background: #fff;
      color: #1f1f1f;
      border: 1px solid #dadce0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px;
    }
    .btn-google:hover { background: #f5f5f5; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .btn-google svg { flex-shrink: 0; }
    .btn-full { width: 100%; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 10px 12px; color: #6060808; border-bottom: 2px solid #2e2e45; font-weight: 600; color: #8080a0; }
    td { padding: 10px 12px; border-bottom: 1px solid #20202e; vertical-align: middle; }
    tr:hover td { background: #1e1e2e; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #4a4a68;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-top: 1px solid #2e2e45;
    }

    /* ── Helpers ── */
    .text-muted { color: #6060808; font-size: 0.85rem; color: #6868888; }
    .text-center { text-align: center; }
    .mt-1 { margin-top: 8px; }
    .mt-2 { margin-top: 16px; }
    .mt-3 { margin-top: 24px; }
    a { color: #a78bfa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus { outline: 2px solid #a78bfa; outline-offset: 2px; border-radius: 2px; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">♪ MelodAI</a>

  {% if user.is_authenticated %}
    <div class="nav-links">
      <a href="{% url 'generation_job_create' %}" class="nav-link">Generate</a>
      <a href="{% url 'generation_job_list' %}" class="nav-link">My Jobs</a>
      <a href="{% url 'library_list' %}" class="nav-link">My Library</a>
    </div>
    <div class="nav-user">
      <span class="nav-username">{{ user.display_name|default:user.email }}</span>
      <a href="{% url 'logout' %}" class="btn-nav-logout">Sign out</a>
    </div>
  {% else %}
    <div class="nav-links"></div>
    <div class="nav-user">
      <a href="{% url 'register' %}" class="btn-nav-logout">Register</a>
      <a href="{% url 'login' %}" class="btn-nav-signin">Sign in</a>
    </div>
  {% endif %}
</nav>

<div class="page-wrapper">
  {% block content %}{% endblock %}
</div>

</body>
</html>
