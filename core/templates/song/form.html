{% extends "core/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto;">
  <h2 style="margin-bottom:1.5rem;">{{ title }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div style="margin-bottom:1.25rem;">
      <label for="{{ field.id_for_label }}" style="display:block;margin-bottom:.4rem;font-weight:500;">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}
        <div style="color:#f87171;margin-top:.25rem;font-size:.875rem;">{{ error }}</div>
      {% endfor %}
    </div>
    {% endfor %}
    <div style="display:flex;gap:.75rem;margin-top:1.5rem;">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'song_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
